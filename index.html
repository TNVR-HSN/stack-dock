      'OK', () => {}, () => {});
    return;
  }

  const source=fromDock?[...dockView.querySelectorAll('.folder-btn')].find(b=>b.dataset.dockEntry===t.id)?.querySelector('.art'):
    [...gsView.querySelectorAll('.tile')].find(b=>b.dataset.tile===t.id)?.querySelector('.art');

    } else if (kind === 'local') {

        target: t.target

    }

    launch.pending=false;

    let regionAvailable=false;
    if(nativeCore?.invoke){
     try{await nativeCore.invoke('set_dock_region',{x:0,y:0,width:0,height:0});regionAvailable=true}
     catch(error){console.warn('Fixed dock host unavailable. Register set_dock_region to enable it.',error)}
    }
    if(regionAvailable){
     root.classList.add('native-dock');
     const work=nativeArea;
     nativeArea=shieldNativeArea(work);
     setCaptionGutter(nativeArea);
     if(await moveHost({x:0,y:0,w:nativeArea.w,h:nativeArea.h})){
      try{applyBox(dockBox());await setNativeRegion(nativeCover(dockBox()));fixedHost=true}
      catch(error){console.warn('Could not clip the fixed dock host:',error)}
     }
     if(!fixedHost){
      nativeArea=work;setCaptionGutter(work);
      applyBox(dockBox());
     }
    }
    if(!fixedHost&&!await moveHost(nativeCover(dockBox()))){
     root.classList.remove('native-dock');nativeWindow=null;nativeArea=null;nativeHost={x:0,y:0};refresh();return;
    }
    root.classList.add('native-dock');
   }finally{nativeBusy=false}
   window.addEventListener('blur',()=>{if(!dialog.open)queueFocusLoss()});
   window.addEventListener('focus',()=>{focusLossPending=false});
   await win.onFocusChanged(({payload:focused})=>{
    if(focused){focusLossPending=false;return}
    if(!dialog.open)queueFocusLoss();
   }).catch(error=>console.warn('Native focus listener unavailable:',error));
 }catch(error){nativeFailure(error)}
}
const nativeReady=startNative();
</script>
<script src="/stack-dock-panels.js"></script>
<script src="/stack-dock-native.js"></script>
<script src="/stack-dock-widget.js"></script>
</body>

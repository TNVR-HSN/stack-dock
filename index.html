<main class="desktop" id="desktop" aria-label="Stack Dock desktop">
<section id="island" class="island" data-phase="closed" aria-label="Stack dock">
  <div id="dockGlass" class="glass"></div><div id="gsGlass" class="glass" style="opacity:0"></div>
  <div id="dockView" class="dock-view"></div><div id="gsView" class="gs-view" inert aria-hidden="true"></div>
  <div id="launchGlass" class="glass" hidden></div><div id="launchView" class="launch-view" role="status" hidden></div>
</section>
</main>
<div id="iconHover" aria-hidden="true" hidden></div>
<div class="menu" id="menu" hidden></div>
<dialog id="dialog"><form id="form"></form></dialog>
<div class="toast" id="toast" role="status" hidden></div>

   <stop stop-color="${light}"/><stop offset="1" stop-color="${dark}"/>

  <path d="M17 24c0-2.2 1.8-4 4-4h8l3 3h11c2.2 0 4 1.8 4 4v14c0 2.2-1.8 4-4 4H21c-2.2 0-4-1.8-4-4V24z" fill="${folder}"/>
  <rect x="21" y="28" width="22" height="3" rx="1.5" fill="${accent}"/>
 </svg>`;
}});
const FOLDER_ICONS={
 'folder-emerald':dockFolderIcon('Emerald','#16c792','#047857','#05271e','#68e7ad'),
 'folder-azure':dockFolderIcon('Blue','#39bdf7','#145599','#092440','#86ddff'),

 file:{svg:`<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
 <path d="M17 8h20l12 12v31a5 5 0 0 1-5 5H17a5 5 0 0 1-5-5V13a5 5 0 0 1 5-5z" fill="#cbd5e1"/>
 <path d="M37 8v12h12" fill="#7888a3"/><path d="M22 31h17m-17 8h13" stroke="#51627e" stroke-width="3" stroke-linecap="round"/>

 <path d="M8 34a5 5 0 0 1 5-5h44a3 3 0 0 1 3 4l-5 14a6 6 0 0 1-6 4H12a5 5 0 0 1-5-5z" fill="#ffd377"/>

 web:{svg:`<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">

 <circle cx="32" cy="32" r="21"/><ellipse cx="32" cy="32" rx="10" ry="21"/><path d="M13 24h38m-38 16h38"/></g>
 </svg>`},

     }
     if(!fixedHost){
      nativeArea=work;setCaptionGutter(work);
      applyBox(dockBox());
     }
    }
    if(!fixedHost&&!await moveHost(nativeCover(dockBox()))){
     root.classList.remove('native-dock');nativeWindow=null;nativeArea=null;nativeHost={x:0,y:0};refresh();return;
    }
    root.classList.add('native-dock');
   }finally{nativeBusy=false}
   window.addEventListener('blur',()=>{if(!dialog.open)queueFocusLoss()});
   window.addEventListener('focus',()=>{focusLossPending=false});
   await win.onFocusChanged(({payload:focused})=>{
    if(focused){focusLossPending=false;return}
    if(!dialog.open)queueFocusLoss();
   }).catch(error=>console.warn('Native focus listener unavailable:',error));
 }catch(error){nativeFailure(error)}
}
const nativeReady=startNative();
</script>
<script src="/stack-dock-native.js"></script>
<script src="/stack-dock-widget.js"></script>
</body>

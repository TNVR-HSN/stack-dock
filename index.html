<div class="menu" id="menu" hidden></div>

  const behavior=settingsCard(general,'Interaction','behavior');

  const tips=settingsCard(general,'Hover labels','behavior');
  const names=check(tips,'Show full icon name on hover',prefs.hoverNames);

  previews.set('dock',previewBox());
  const position=settingsCard(dock,'Screen position','layout');

  edge.onchange=()=>{const a=alignment.value;alignment.replaceChildren(...choices().map(([v,n])=>{const x=E('option','',n);x.value=v;return x}));alignment.value=a;draw()};
  collectDock=appearance(dock,{...dockDefaults,...state.dock},false);
  function ensure(f){

   const name=field(identity,'Folder name','text',f.name,{maxLength:40});

   const useSize=check(identity,'Override dock icon size',f.triggerSize);
   const size=field(identity,'Custom folder icon size','range',f.triggerSize||state.dock.icon,{min:24,max:74,datasetUnit:' px'});
   const ownCorner=check(identity,'Override dock icon roundness',Number.isFinite(f.dockIconCorner)||['raw','rounded'].includes(f.dockIconShape));
   const dockCorner=field(identity,'Dock icon roundness','range',Number.parseFloat(dockIconRadius(f,collectDock())),{min:0,max:50,datasetUnit:'%'});
   const cornerOutput=dockCorner.parentElement.querySelector('output');
   dockCorner.oninput=()=>cornerOutput.textContent=dockCorner.value*2+'%';
   dockCorner.oninput();
   dockCorner.disabled=!ownCorner.checked;ownCorner.onchange=()=>{dockCorner.disabled=!ownCorner.checked;};
   size.disabled=!useSize.checked;useSize.onchange=()=>{size.disabled=!useSize.checked;if(useSize.checked&&size.value==state.dock.icon){size.value=collectDock().icon;size.dispatchEvent(new Event('input'))}};
   const icon=iconPicker(folderPane,FOLDER_ICONS,f.icon,f.image,37,true,error,()=>queueMicrotask(draw),null,f);

   const gsPreview=previewBox(gs),layout=settingsCard(gs,'Grid layout','layout');
   layout.classList.add('gs-dimensions');
   const cols=field(layout,'Columns','number',f.cols,{min:1,max:12});

   const settingsGear=check(layout,'Show Settings gear in this grid',f.style.settingsGear);
   settingsGear.parentElement.classList.add('card-toggle');
   layout.append(E('p','note','Shortcuts stay in their assigned cells. Move a shortcut before shrinking past its cell.'));
   const style=appearance(gs,{...gsDefaults,...f.style},true);
   const c={f,folderPane,gs,name,folderHoverLabels,useSize,size,ownCorner,dockCorner,icon,cols,rows,settingsGear,style,folderPreview,gsPreview};cache.set(f.id,c);return c;
  }
  function show(key){
   tab=key;error.hidden=true;
   const c=key==='dock'||key==='general'?null:ensure(folder);
   const node=key==='general'?general:key==='dock'?dock:key==='folder'?c.folderPane:c.gs;
   const sample=key==='dock'?previews.get('dock'):key==='folder'?c.folderPreview:key==='gs'?c.gsPreview:null;
   for(const [t,b] of byTab){b.setAttribute('aria-selected',String(key===t));b.tabIndex=key===t?0:-1}

   node.id='settings-pane-'+key;node.setAttribute('aria-labelledby','settings-tab-'+key);
   const categories=groups[key];
   const choose=group=>{
    activeGroups[key]=group;
    for(const n of node.children)n.hidden=!!n.dataset.group&&n.dataset.group!==group;
    for(const button of groupBar.children)button.setAttribute('aria-pressed',String(button.dataset.group===group));
    scroll.scrollTop=0;
   };
   groupBar.replaceChildren(...categories.map(([value,label])=>{
    const b=B(label,'',()=>choose(value));b.dataset.group=value;return b;
   }));
   groupBar.style.visibility=categories.length===1?'hidden':'visible';
   scroll.replaceChildren(node);
   previewSlot.hidden=!sample;
   previewSlot.replaceChildren(...(sample?[sample,E('p','note','Hover over the preview icons to try effects.')]:[]));
   choose(activeGroups[key]||categories[0][0]);draw();
  }
  activate=(f,key)=>{folder=f;chooser.value=f.id;show(key)};
  body.append(tablist,groupBar,targetWrap,workspace);
  scroll.addEventListener('input',draw);scroll.addEventListener('change',draw);
  if(creating)ensure(newFolder);
  show(initial);queueMicrotask(draw);
 },()=>{
  const changes=[];
  function invalid(c,key,input,message){if(key==='gs')activeGroups.gs='layout';activate(c.f,key);input?.focus();throw Error(message)}
  for(const c of cache.values()){
   const name=c.name.value.trim();if(!name)invalid(c,'folder',c.name,'Enter a folder name.');
   let icon;try{icon=c.icon()}catch(e){invalid(c,'folder',null,e.message)}
   const cols=+c.cols.value,rows=+c.rows.value;
   if(!Number.isInteger(cols)||cols<1||cols>12)invalid(c,'gs',c.cols,'Enter a column count between 1 and 12.');
   if(!Number.isInteger(rows)||rows<1||rows>MAX_ROWS)invalid(c,'gs',c.rows,'Enter a row count between 1 and '+MAX_ROWS+'.');
   if(c.f.slots.some(t=>t.c>=cols))invalid(c,'gs',c.cols,'Move shortcuts out of the columns you want to remove first.');
   if(c.f.slots.some(t=>t.r>=rows))invalid(c,'gs',c.rows,'Move shortcuts out of the rows you want to remove first.');
   changes.push([c.f,{name,...icon,folderHoverLabels:c.folderHoverLabels.checked,dockIconShape:undefined,dockIconCorner:c.ownCorner.checked?+c.dockCorner.value:undefined,triggerSize:c.useSize.checked?+c.size.value:0,cols,rows,style:{...c.style(),settingsGear:c.settingsGear.checked}}]);
  }
  const personal=collectGeneral(),dock={...collectDock(),...personal.dock},nextEdge=edge.value,nextAlign=alignment.value;
  const commit=()=>{
   for(const [f,v] of changes)Object.assign(f,v);
   if(creating)state.folders.push(newFolder);
   state.dock=dock;state.general=personal.general;state.edge=nextEdge;state.align=nextAlign;
   persist();return ()=>{if(phase==='open')renderDock();refresh()};
  };
  const startup=applyStartup();

 },true)
}
function guess(target){
 if(/^https?:\/\//i.test(target))return 'url';
 if(/^[a-z][a-z0-9+.-]+:\/\//i.test(target))return 'uri';
 return /\.exe$/i.test(target)?'program':'local';
}
function editShortcut(f,where,t){
 const base=t||{id:uid(),type:'item',name:'',target:'',kind:'program',args:'',cwd:'',icon:'web',image:''};
 let name,kind,target,args,cwd,icon;
 dialogBuild(t?'Shortcut properties':'Add shortcut here','Row '+(where.r+1)+', column '+(where.c+1)+'','Save shortcut',(body,error)=>{
  const p=section(body,'Shortcut target');
  name=field(p,'Display name','text',base.name,{required:true,maxLength:65});
  const savedKind = base.kind || guess(base.target);
  kind = select(p, 'Target type', [
  ['program', 'Program'],
  ['local', 'File or folder'],
  ['url', 'Web link']
], savedKind === 'uri' ? 'url' : savedKind);
  kind.classList.add('sd-target-type');
  target=field(p,'Target location','text',base.target,{required:true});
  args=field(p,'Arguments','text',base.args||'');
  cwd=field(p,'Start in','text',base.cwd||'');
  const update=()=>{args.closest('label').hidden=cwd.closest('label').hidden=kind.value!=='program';target.placeholder=kind.value==='url'?'https://example.com':kind.value==='uri'?'steam://rungameid/…':'C:\\Path\\To\\Shortcut'};
  kind.onchange=update;update();
  icon=iconPicker(body,APP_ICONS,base.icon,base.image,38,false,error);
 },()=>{
  const n=name.value.trim(),dest=target.value.trim(),pick=icon();if(!n||!dest)throw Error('Enter a name and target.');
  if (kind.value === 'url') {
  try {
    new URL(dest);
  } catch {
    throw new Error('Enter a full URL, including its scheme.');
  }
}
  Object.assign(base,{name:n,target:dest,kind:kind.value,args:kind.value==='program'?args.value.trim():'',cwd:kind.value==='program'?cwd.value.trim():'',...pick});
  if(!t&&!placeEntries(f,where,[base]))throw Error('This grid is full.');
  persist();return refresh;
 });
}
async function openDestination(t){
 try{
  if(!nativeCore?.invoke)throw Error('Open destinations from the Stack Dock desktop app.');
  await nativeCore.invoke('open_shortcut_destination',{target:t.target});
 }catch(error){
  dialogBuild('Could not open destination',String(error),'OK',()=>{},()=>{});
 }
}
let resized=0;
window.addEventListener('resize',()=>{
 if(nativeWindow)return;
 clearTimeout(resized);resized=setTimeout(()=>{
  closeMenu();clearPointer();
  if(phase==='closing'){stopMotion();finishClose(false)}
  else if(phase==='opening'){stopMotion();setPhase('open');refresh()}
  else refresh();
 },50)
});
setPhase('closed');refresh();
async function startNative(){
 if(!nativeAPI)return;
 try{
   const monitor=await nativeAPI.currentMonitor();
   if(!monitor?.workArea)throw Error('No monitor work area returned');
   const {position,size}=monitor.workArea,scale=monitor.scaleFactor;
   const win=nativeAPI.getCurrentWindow();
   // Cover the exact usable rectangle. Dock breathing room is applied inside it.
  nativeArea = {
    px: position.x,
    py: position.y,
    w: size.width / scale,
    h: size.height / scale,
    scale
  };
   nativeWindow=win;
   const root=document.documentElement;
   nativeBusy=true;
   try{
    renderDock();applyBox(dockBox());views(false);
    let regionAvailable=false;
    if(nativeCore?.invoke){
     try{await nativeCore.invoke('set_dock_region',{x:0,y:0,width:0,height:0});regionAvailable=true}
     catch(error){console.warn('Fixed dock host unavailable. Register set_dock_region to enable it.',error)}
    }
    if(regionAvailable){
     root.classList.add('native-dock');
     const work=nativeArea;
     nativeArea=shieldNativeArea(work);
     setCaptionGutter(nativeArea);
     if(await moveHost({x:0,y:0,w:nativeArea.w,h:nativeArea.h})){
      try{applyBox(dockBox());await setNativeRegion(nativeCover(dockBox()));fixedHost=true}
      catch(error){console.warn('Could not clip the fixed dock host:',error)}
     }
     if(!fixedHost){
      nativeArea=work;setCaptionGutter(work);
      applyBox(dockBox());
     }
    }
    if(!fixedHost&&!await moveHost(nativeCover(dockBox()))){
     root.classList.remove('native-dock');nativeWindow=null;nativeArea=null;nativeHost={x:0,y:0};refresh();return;
    }
    root.classList.add('native-dock');
   }finally{nativeBusy=false}
   window.addEventListener('blur',()=>{if(!dialog.open)queueFocusLoss()});
   window.addEventListener('focus',()=>{focusLossPending=false});
   await win.onFocusChanged(({payload:focused})=>{
    if(focused){focusLossPending=false;return}
    if(!dialog.open)queueFocusLoss();
   }).catch(error=>console.warn('Native focus listener unavailable:',error));
 }catch(error){nativeFailure(error)}
}
const nativeReady=startNative();

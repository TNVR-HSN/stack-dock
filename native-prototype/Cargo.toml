[package]
name = "stack-dock-native"
version = "0.1.0"
edition = "2024"
publish = false

[profile.release]
strip = true
lto = "thin"

[dependencies]
base64 = "0.22.1"
fontdue = "0.9.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"


[target.'cfg(windows)'.dependencies]
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com",
    "Win32_System_Com_StructuredStorage", "Win32_System_Ole","Win32_System_Memory",
    "Win32_System_SystemServices", "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

